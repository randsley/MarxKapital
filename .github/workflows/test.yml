name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        julia-version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia install_deps.jl
        env:
          GKSwstype: "100"
      - name: Run tests
        run: julia test/runtests.jl
        env:
          GKSwstype: "100"
      - name: Notebook dependencies
        run: julia -e 'using Pkg; Pkg.add(["PlutoUI", "JSON"])'
      - name: Run notebooks
        run: julia test/notebooks.jl
        env:
          GKSwstype: "100"
