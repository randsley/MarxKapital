# NOTE: the dependencies are deliberately not listed in [deps] with UUIDs.
# This project is loaded with `include("src/MarxKapital.jl")` (script style),
# and the dependencies are installed with `julia install_deps.jl`, letting Pkg
# resolve the correct UUIDs against the General registry. This avoids
# mismatched hand-written UUIDs.

